# Standalone external-database worker for a Vercel-hosted application.
name: danaconnect-worker
services:
  worker:
    image: danaconnect-api:${RELEASE_TAG:-local}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    env_file: [.env.worker]
    command: ["python", "-m", "app.jobs_calendar", "--interval", "60"]
    restart: unless-stopped
    init: true
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
