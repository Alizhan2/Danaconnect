name: Application checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_api_tests:
        description: Run the existing API tests explicitly
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r apps/api/requirements.lock.txt
      - run: python -m compileall -q app migrations
        working-directory: apps/api
      - run: python -m pytest -q
        if: github.event_name == 'workflow_dispatch' && inputs.run_api_tests
        working-directory: apps/api
        env:
          ENVIRONMENT: test
          DATABASE_URL: sqlite:///./test-application.db
          AUTH_DEBUG_CODE: 'true'
          DEMO_MODE: 'false'
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run typecheck
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - run: npm ci
        working-directory: apps/admin
      - run: npm run typecheck
        working-directory: apps/admin
      - run: npm run build
        working-directory: apps/admin
        env:
          ADMIN_BASE_PATH: /admin
          NEXT_PUBLIC_WEB_URL: https://example.invalid
