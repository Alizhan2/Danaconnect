name: Application checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r apps/api/requirements.lock.txt
      - run: python -m compileall -q app migrations
        working-directory: apps/api
      - run: python scripts/api-tests.py
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run typecheck
        working-directory: apps/web
      - run: node scripts/frontend-tests.mjs
      - run: node scripts/date-format-tests.mjs
      - run: node scripts/download-tests.mjs
      - run: node scripts/mobile-navigation-tests.mjs
      - run: npm run build
        working-directory: apps/web
  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - run: npm ci
        working-directory: apps/admin
      - run: npm run typecheck
        working-directory: apps/admin
      - run: npm run build
        working-directory: apps/admin
        env:
          ADMIN_BASE_PATH: /admin
          NEXT_PUBLIC_WEB_URL: https://example.invalid
