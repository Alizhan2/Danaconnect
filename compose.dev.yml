# Optional local PostgreSQL service. Start with docker compose -f compose.dev.yml up -d.
# Requires a running Docker daemon; the default local application uses SQLite.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: danaconnect
      POSTGRES_PASSWORD: local-dev-only
      POSTGRES_DB: danaconnect
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U danaconnect -d danaconnect"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_dev:
